schema_version: "1.1"
name: 06-card-after-humanizer-turn1
tags: [writing-cards]
# `04` with `humanizer` installed beside the skill, which `tools/eval.sh` copies in from
# this machine's plugins.
plugins: ["../../..", "../../../.eval-plugins/humanizer"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  append_system_prompt: "The shell in this environment refuses loops such as `for` and `while`, so run each command on its own. `find` on its own always runs; read a file with the Read tool."
  prompt: "scrivi la card per la slice «Chiedere il link di reset» di FEATURE.md: chi ha dimenticato la password apre la pagina dal link «Forgot password?», scrive la sua email e vede la conferma. Linear, team Mobile. È l'unica card nello scope, il progetto non ha altre card, e una volta approvata va salvata in cards.md. Non ho altre decisioni da darti: quello che manca resta un punto aperto della card. Scrivila."
